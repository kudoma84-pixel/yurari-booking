<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>カウンセリングシート試作｜整体院 癒楽里</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --field:#FAFAF7; --card:#ffffff; --ink:#2f3a2f; --sub:#6b6b6b; --line:#e3e3dc;
  --green:#3a5a3a; --green2:#5a9e7a; --soft:#eef5ef; --accent:#E8742A; --warn:#b3261e;
  --chip:#f5f5f0; --chipOn:#3a5a3a; --chipOnInk:#fff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.7}
body.tablet{font-size:19px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
body.tablet .wrap{max-width:820px;padding:24px 28px 140px}
.proto{background:#fff3cd;color:#6b4e00;border:1px solid #f0d58a;border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
.mode{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px;font-size:12.5px;color:var(--sub);align-items:center;flex-wrap:wrap}
.mode button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;cursor:pointer}
.mode button.on{background:var(--green);color:var(--chipOnInk);border-color:var(--green)}
header.brand{text-align:center;margin:6px 0 14px}
header.brand .n{font-weight:700;color:var(--green);font-size:1.15em;letter-spacing:.06em}
header.brand .t{font-size:.86em;color:var(--sub)}
.steps{display:flex;gap:4px;margin:0 0 16px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--green2)}
.stepname{font-size:.82em;color:var(--sub);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:14px}
body.tablet .card{padding:24px 24px}
h2{font-size:1.15em;margin:0 0 4px;color:var(--green)}
.lead{color:var(--sub);font-size:.9em;margin:0 0 12px}
.field{margin:14px 0}
.field > label, .qlabel{display:block;font-weight:700;font-size:.95em;margin-bottom:6px}
.req{display:inline-block;font-size:.72em;color:#fff;background:var(--accent);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle;font-weight:500}
.opt{display:inline-block;font-size:.72em;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle;font-weight:500}
.hint{font-size:.8em;color:var(--sub);margin-top:4px}
input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green2)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px}
.row > *{flex:1;min-width:0}
.inline{display:flex;gap:8px;align-items:center}
.inline input{max-width:110px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:.92em;cursor:pointer}
body.tablet .chip{padding:10px 18px}
.chip.on{background:var(--chipOn);border-color:var(--chipOn);color:var(--chipOnInk);font-weight:700}
.err{color:var(--warn);font-size:.85em;margin-top:6px;display:none}
.err.show{display:block}
.rules{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg);font-size:.88em}
.rules ol,.rules ul{padding-left:1.3em;margin:6px 0}
.rules li{margin:4px 0}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-weight:700}
.agree input{width:24px;height:24px;margin-top:3px;accent-color:var(--green2)}
.btns{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
.btns .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
body.tablet .btns .in{max-width:820px}
.btn{flex:2;border:none;border-radius:14px;padding:15px;font:inherit;font-weight:700;background:var(--green);color:var(--chipOnInk);cursor:pointer}
.btn.sub{flex:1;background:var(--card);color:var(--sub);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.sym{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.sym .h{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--green)}
.sym .x{border:none;background:none;color:var(--sub);font:inherit;font-size:.85em;cursor:pointer}
.addbtn{width:100%;border:2px dashed var(--line);background:none;color:var(--green);border-radius:14px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.bodywrap{position:relative;max-width:420px;margin:8px auto 0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bodywrap img{width:100%;display:block;border-radius:10px;background:#fff}
.mark{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;color:var(--warn);font-weight:700;font-size:26px;line-height:30px;text-align:center;pointer-events:none;text-shadow:0 0 3px #fff,0 0 3px #fff}
.bodylbl{display:grid;grid-template-columns:1fr 1fr;text-align:center;max-width:420px;margin:2px auto 0;font-size:.85em;color:var(--sub)}
.bodybar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.85em;color:var(--sub)}
.bodybar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;cursor:pointer}
dl.sum{margin:0;display:grid;grid-template-columns:8.5em 1fr;gap:6px 12px;font-size:.92em}
dl.sum dt{color:var(--sub)}
dl.sum dd{margin:0;word-break:break-word}
.done{text-align:center;padding:28px 12px}
.done .ok{font-size:46px}
.qr{width:200px;height:200px;margin:14px auto;border:2px solid var(--line);border-radius:12px;display:grid;place-items:center;background:#fff;color:#333;font-size:12px}
.count{font-size:.85em;color:var(--sub);margin-top:10px}
.hidden{display:none}
.prebn{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:.92em}
.prebn b{color:var(--green)}
.prebn .via{font-size:.78em;color:var(--sub);margin-top:4px}
.editlink{border:none;background:none;color:var(--green);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="proto"><b>社内確認用の試作です（お客様向けのページではありません）。</b>試作品です。入力した内容はどこにも保存・送信されません。スマホとタブレットで触って、項目や言い回しを確かめてください。</div>
  <div class="mode">見え方：
    <button id="mPhone" class="on" type="button">お客様のスマホ</button>
    <button id="mTab" type="button">受付タブレット</button>
    <button id="mPre" type="button">Web予約済みの方</button>
  </div>
  <header class="brand"><div class="n">整体院 癒楽里</div><div class="t">カウンセリングシート（ご来院前のご記入）</div></header>
  <div class="steps" id="steps"></div>
  <div id="prebanner"></div>
  <div class="stepname" id="stepname"></div>
  <main id="main"></main>
</div>
<div class="btns" id="btns"><div class="in">
  <button class="btn sub" id="back" type="button">戻る</button>
  <button class="btn" id="next" type="button">次へ</button>
</div></div>

<script>
(function(){
const S = {
  mode:'phone', step:0,
  agree:false,
  kana:'', name:'', gender:'', by:'', bm:'', bd:'', zip:'', addr:'', mobile:'', home:'', email:'', usesLine:'yes',
  found:[], introducer:'', job:'', commute:[], commuteMin:'', workHours:'', holiday:[], family:'',
  bath:'', bathMin:'', sleepPos:[], sleepHours:'', stress:[], stressOther:'',
  sportNow:'', sportPast:'', illness:'', medicine:'',
  symptoms:[{what:'',since:'',tried:'',want:''}], marks:[], note:''
};
const STEPS = ['ご確認とご同意','お客様情報','生活のこと','お悩みのこと','入力内容の確認','完了'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SAMPLE = {kana:'やまだ はなこ', name:'山田 花子', by:'1975', bm:'4', bd:'12', mobile:'090-1234-5678', email:'', usesLine:'LINEで受け取る'};
function setMode(m){
  S.mode = m;
  document.body.classList.toggle('tablet', m==='tablet');
  $('#mPhone').classList.toggle('on', m==='phone');
  $('#mTab').classList.toggle('on', m==='tablet');
  $('#mPre').classList.toggle('on', m==='pre');
  resetAll();
}
$('#mPhone').onclick = () => setMode('phone');
$('#mTab').onclick = () => setMode('tablet');
$('#mPre').onclick = () => setMode('pre');

function chips(key, options, multi){
  return `<div class="chips" data-key="${key}" data-multi="${multi?1:0}">` + options.map(o => {
    const on = multi ? S[key].includes(o) : S[key] === o;
    return `<button type="button" class="chip${on?' on':''}" data-val="${esc(o)}">${esc(o)}</button>`;
  }).join('') + `</div>`;
}
function input(key, type='text', ph='', extra=''){
  return `<input type="${type}" data-key="${key}" value="${esc(S[key])}" placeholder="${esc(ph)}" ${extra}>`;
}
function textarea(key, ph=''){
  return `<textarea data-key="${key}" placeholder="${esc(ph)}">${esc(S[key])}</textarea>`;
}
function years(){ const y = 2026; let o='<option value="">年</option>'; for(let i=y;i>=1920;i--) o+=`<option${S.by==i?' selected':''}>${i}</option>`; return o; }
function nums(n, cur, label){ let o=`<option value="">${label}</option>`; for(let i=1;i<=n;i++) o+=`<option${cur==i?' selected':''}>${i}</option>`; return o; }

const RULES = `
<b>～ 気持ちよく施術を受けていただくために ～</b>
<ol>
<li>予約制ですので、来院時間をお守りください。</li>
<li>予約時間に遅れる際は、必ず電話での連絡をお願いいたします。</li>
<li>予約の変更は、必ず事前に連絡をしてください。</li>
<li>予約時間を忘れてしまった場合は、後日でも必ず連絡をしてください。</li>
<li>予約時間に遅れて来院された場合は、現在順番待ちをされている方の後の施術になります。（混雑時は後日の予約になります）</li>
<li>無断キャンセルをした場合は、その後のご予約は受け付けません。</li>
<li>無断キャンセル、当日キャンセル、予約時間の1時間以内の変更は施術料の100％の金額をご負担いただきます。</li>
<li>院内では、携帯電話の通話はご遠慮ください。また設定をマナーモードにしてください。</li>
<li>ひどく汚れた服装での来院はご遠慮ください。</li>
</ol>
<b>■ 施術を受けられる方へ ■</b>
<ul>
<li>当院での整体法は、他の整体療法、カイロプラクティック等の施術とは全く異なります。施術時間もその方の状態により異なります。</li>
<li>症状を根本に改善する方法ですから、慰安的な刺激や施術の回数で判断される方は最初からご遠慮ください。</li>
<li>お身体はわずかな刺激であっても疲労することがあります。当院の整体法はお身体にご負担の無い刺激で出来るだけ短時間で症状を改善させる整体法です。</li>
<li>施術時間は通常10分～20分程度です。施術箇所の多さにより前後します。</li>
<li>施術方法や施術時間は、その日の体調や症状によって変わります。</li>
<li>施術は基本的に痛みを伴うことは少ないです。施術中はリラックスして楽な呼吸をしてください。</li>
<li>基本は手技のみで行います。症状に応じて胸部、腹部、臀部、股関節周辺等にアプローチをする場合もあります。</li>
<li>症状によってはご予約時間通りに施術が出来ず、お待ちいただく場合があります。</li>
<li>慢性症状の場合は一度の施術では変化が感じられない場合もあります。繰り返し施術をすることで改善が見込めます。</li>
<li>楽な時ほど無理な運動や睡眠不足にならないように注意してください。</li>
<li>当院では初回を含めて6回の施術を改善の目安としております。（初回から3回目までは3日～4日毎、4回～6回目は1週間毎が基本）</li>
<li>施術後には、その方の状態に合わせて最適なご予約の日程をご提案します。</li>
</ul>`;

function page(){
  switch(S.step){
  case 0: return `<section class="card">
    <h2>はじめにお読みください</h2>
    <p class="lead">ご記入の前に、当院からのお願いをご確認ください。</p>
    <div class="rules">${RULES}</div>
    <label class="agree"><input type="checkbox" id="agree" ${S.agree?'checked':''}> 上記の内容を読み、了承しました</label>
  </section>`;
  case 1: if (S.mode==='pre' && !S.editInfo) {
    const birth = S.by && S.bm && S.bd ? `${S.by}年${S.bm}月${S.bd}日` : '';
    return `<section class="card">
    <h2>ご登録内容の確認</h2>
    <p class="lead">ご予約のときにご登録いただいた内容です。お間違いがなければ「次へ」へお進みください。</p>
    <dl class="sum">
      <dt>お名前</dt><dd>${esc(S.name)}（${esc(S.kana)}）</dd>
      <dt>生年月日</dt><dd>${birth}</dd>
      <dt>携帯電話</dt><dd>${esc(S.mobile)}</dd>
      <dt>ご連絡方法</dt><dd>${esc(S.usesLine)}</dd>
    </dl>
    <button type="button" class="editlink" id="editInfo">内容を修正する・ご住所などを追加する</button>
  </section>`; }
  return `<section class="card">
    <h2>お客様情報</h2>
    <p class="lead">ご予約や会員登録にも使います。</p>
    <div class="field"><label>ふりがな<span class="req">必須</span></label>${input('kana','text','やまだ はなこ')}<div class="err" id="e-kana">ふりがなを入力してください</div></div>
    <div class="field"><label>お名前<span class="req">必須</span></label>${input('name','text','山田 花子')}<div class="err" id="e-name">お名前を入力してください</div></div>
    <div class="field"><label>性別<span class="opt">任意</span></label>${chips('gender',['男性','女性','回答しない'],false)}</div>
    <div class="field"><label>生年月日<span class="req">必須</span></label>
      <div class="row"><select data-key="by">${years()}</select><select data-key="bm">${nums(12,S.bm,'月')}</select><select data-key="bd">${nums(31,S.bd,'日')}</select></div>
      <div class="hint">マイページのログイン（携帯番号の下4桁＋誕生日）にも使います</div>
      <div class="err" id="e-birth">生年月日を選んでください</div></div>
    <div class="field"><label>郵便番号<span class="opt">任意</span></label>${input('zip','tel','336-0025','inputmode="numeric" style="max-width:180px"')}<div class="hint">本番では、郵便番号から住所が自動で入ります</div></div>
    <div class="field"><label>ご住所<span class="opt">任意</span></label>${input('addr','text','さいたま市南区…')}</div>
    <div class="field"><label>携帯電話<span class="req">必須</span></label>${input('mobile','tel','090-1234-5678','inputmode="tel"')}<div class="err" id="e-mobile">携帯電話の番号を入力してください</div></div>
    <div class="field"><label>ご自宅の電話<span class="opt">任意</span></label>${input('home','tel','048-…','inputmode="tel"')}</div>
    <div class="field"><label class="qlabel">ご予約の連絡の受け取り方</label>${chips('usesLine',['LINEで受け取る','メールで受け取る'],false)}</div>
    <div class="field"><label>メールアドレス${S.usesLine==='メールで受け取る'?'<span class="req">必須</span>':'<span class="opt">任意</span>'}</label>${input('email','email','example@mail.com','inputmode="email" autocapitalize="off"')}<div class="err" id="e-email">メールアドレスを入力してください</div></div>
  </section>`;
  case 2: return `<section class="card">
    <h2>生活のこと</h2>
    <p class="lead">分かる範囲でお答えください。施術の参考にします。</p>
    <div class="field"><label class="qlabel">当院を何でお知りになりましたか？（いくつでも）</label>${chips('found',['看板','ホームページ','Googleマップ','ホットペッパー','エキテン','EPARK','楽天ビューティー','チラシ','LINE','ご紹介'],true)}
      <div class="${S.found.includes('ご紹介')?'':'hidden'}" style="margin-top:8px">${input('introducer','text','ご紹介者のお名前')}</div></div>
    <div class="field"><label>ご職業</label>${input('job','text','例：事務職、主婦、学生')}</div>
    <div class="field"><label class="qlabel">通勤方法と時間</label>${chips('commute',['車','電車','バス','自転車','徒歩','在宅'],true)}
      <div class="inline" style="margin-top:8px">片道 ${input('commuteMin','number','30','inputmode="numeric"')} 分</div></div>
    <div class="field"><label class="qlabel">お仕事の時間・お休み</label>
      <div class="inline">1日 ${input('workHours','number','8','inputmode="numeric"')} 時間</div>
      <div style="margin-top:8px">${chips('holiday',['月','火','水','木','金','土','日','不定休'],true)}</div></div>
    <div class="field"><label>同居されているご家族</label>${input('family','text','例：夫、子ども2人')}</div>
    <div class="field"><label class="qlabel">入浴</label>${chips('bath',['シャワーのみ','湯船につかる'],false)}
      <div class="inline ${S.bath==='湯船につかる'?'':'hidden'}" style="margin-top:8px">約 ${input('bathMin','number','15','inputmode="numeric"')} 分</div></div>
    <div class="field"><label class="qlabel">寝るときの姿勢（いくつでも）と睡眠時間</label>${chips('sleepPos',['仰向け','うつ伏せ','右向き','左向き'],true)}
      <div class="inline" style="margin-top:8px">約 ${input('sleepHours','number','6','inputmode="numeric"')} 時間</div></div>
    <div class="field"><label class="qlabel">ストレスを感じていること（いくつでも）</label>${chips('stress',['体調','家族','仕事','育児','介護','特にない','その他'],true)}
      <div class="${S.stress.includes('その他')?'':'hidden'}" style="margin-top:8px">${input('stressOther','text','その他の内容')}</div></div>
    <div class="field"><label>普段している運動</label>${input('sportNow','text','例：ウォーキング週2回')}</div>
    <div class="field"><label>過去にしていた運動</label>${input('sportPast','text','例：学生時代にバレーボール')}</div>
    <div class="field"><label>これまでの病気・怪我</label>${textarea('illness','例：10年前にぎっくり腰、骨折など')}</div>
    <div class="field"><label>現在飲んでいるお薬</label>${textarea('medicine','例：血圧の薬、痛み止め　など（なければ「なし」）')}</div>
  </section>`;
  case 3: return `<section class="card">
    <h2>お悩みのこと</h2>
    <p class="lead">お悩みの症状を、気になる順に最大5つまで教えてください（身体・メンタルなど）。</p>
    ${S.symptoms.map((s,i)=>`<div class="sym">
      <div class="h">${'①②③④⑤'[i]} のお悩み ${S.symptoms.length>1?`<button type="button" class="x" data-del="${i}">削除</button>`:''}</div>
      <div class="field"><label>症状${i===0?'<span class="req">必須</span>':''}</label><input type="text" data-sym="${i}" data-f="what" value="${esc(s.what)}" placeholder="例：右の腰が痛い"></div>
      <div class="field"><label>いつから・きっかけ</label><input type="text" data-sym="${i}" data-f="since" value="${esc(s.since)}" placeholder="例：3か月前、重い物を持ってから"></div>
      <div class="field"><label>これまでの対処</label><input type="text" data-sym="${i}" data-f="tried" value="${esc(s.tried)}" placeholder="例：湿布、整形外科で電気治療"></div>

function render(){
  $('#steps').innerHTML = STEPS.map((_,i)=>`<span class="${i<=S.step?'on':''}"></span>`).join('');
  const names = S.mode==='pre' ? STEPS.map((n,i)=>i===1?'ご登録内容の確認':n) : STEPS;
  $('#stepname').textContent = `${Math.min(S.step+1,STEPS.length)} / ${STEPS.length}　${names[S.step]}`;
  $('#prebanner').innerHTML = S.mode==='pre' && S.step<5 ? `<div class="prebn"><b>${esc(SAMPLE.name)} 様</b>　ご予約ありがとうございます。<br>11月20日（金）10:00　南浦和院<br>ご来院前に、カウンセリングシートのご記入をお願いします（約5分）。<div class="via">※試作：予約確認のLINE・前日リマインドに付く「問診票のご記入はこちら」から開いた画面のイメージです</div></div>` : '';
  $('#main').innerHTML = page();
  $('#back').style.visibility = (S.step===0||S.step===5) ? 'hidden' : 'visible';
  $('#next').textContent = S.step===4 ? '送信する' : S.step===5 ? '最初から試す' : S.step===0 ? '同意して入力へ進む' : '次へ';
  $('#next').disabled = S.step===0 && !S.agree;
  bind();
  if (S.step===5 && S.mode==='tablet') startCountdown();
}

let timer=null;
function startCountdown(){ clearTimeout(timer); timer=setTimeout(()=>{ if(S.step===5 && S.mode==='tablet') resetAll(); }, 30000); }
function resetAll(){
  clearTimeout(timer);
  const m = S.mode;
  Object.assign(S, {step:0,agree:false,kana:'',name:'',gender:'',by:'',bm:'',bd:'',zip:'',addr:'',mobile:'',home:'',email:'',usesLine:'LINEで受け取る',
    found:[],introducer:'',job:'',commute:[],commuteMin:'',workHours:'',holiday:[],family:'',bath:'',bathMin:'',sleepPos:[],sleepHours:'',stress:[],stressOther:'',
    sportNow:'',sportPast:'',illness:'',medicine:'',symptoms:[{what:'',since:'',tried:'',want:''}],marks:[],note:''});
  S.mode = m; S.editInfo = false;
  if (m==='pre') Object.assign(S, SAMPLE);
  window.scrollTo(0,0); render();
}

function bind(){
  const ag = $('#agree'); if (ag) ag.onchange = () => { S.agree = ag.checked; $('#next').disabled = !S.agree; };
  document.querySelectorAll('[data-key]').forEach(el => {
    if (el.classList.contains('chips')) return;
    el.addEventListener('input', () => { S[el.dataset.key] = el.value; });
    el.addEventListener('change', () => { S[el.dataset.key] = el.value; });
  });
  document.querySelectorAll('.chips').forEach(box => {
    box.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      const key = box.dataset.key, v = b.dataset.val, multi = box.dataset.multi==='1';
      if (multi) { const a = S[key]; const i = a.indexOf(v); i>=0 ? a.splice(i,1) : a.push(v); }
      else S[key] = (S[key]===v ? '' : v);
      if (['found','stress','bath','usesLine'].includes(key)) { keepScroll(render); }
      else b.classList.toggle('on');
    });
  });
  document.querySelectorAll('[data-sym]').forEach(el => el.addEventListener('input', () => { S.symptoms[+el.dataset.sym][el.dataset.f] = el.value; }));
  document.querySelectorAll('[data-del]').forEach(el => el.onclick = () => { S.symptoms.splice(+el.dataset.del,1); keepScroll(render); });
  const add = $('#addSym'); if (add) add.onclick = () => { S.symptoms.push({what:'',since:'',tried:'',want:''}); keepScroll(render); };
  const bw = $('#bodywrap');
  if (bw) bw.addEventListener('click', e => {
    const r = bw.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100;
    const hit = S.marks.findIndex(m => Math.hypot((m.x-x)*r.width/100, (m.y-y)*r.height/100) < 22);
    if (hit >= 0) S.marks.splice(hit,1); else S.marks.push({x:+x.toFixed(1), y:+y.toFixed(1)});
    keepScroll(render);
  });
  const cm = $('#clearMarks'); if (cm) cm.onclick = () => { S.marks = []; keepScroll(render); };
  const rs = $('#reset'); if (rs) rs.onclick = resetAll;
  const ei = $('#editInfo'); if (ei) ei.onclick = () => { S.editInfo = true; render(); };
}
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0,y); }

function validate(){
  const show = (id, bad) => { const e = $('#'+id); if (e) e.classList.toggle('show', !!bad); return !bad; };
  if (S.step===1){
    let ok = true;
    ok = show('e-kana', !S.kana.trim()) && ok;
    ok = show('e-name', !S.name.trim()) && ok;
    ok = show('e-birth', !(S.by&&S.bm&&S.bd)) && ok;
    ok = show('e-mobile', !S.mobile.replace(/\D/g,'')) && ok;
    ok = show('e-email', S.usesLine==='メールで受け取る' && !S.email.trim()) && ok;
    if (!ok) { const f = document.querySelector('.err.show'); f && f.scrollIntoView({behavior:'smooth',block:'center'}); }
    return ok;
  }
  if (S.step===3){
    const ok = show('e-sym', !S.symptoms[0].what.trim());
    if (!ok) $('#e-sym').scrollIntoView({behavior:'smooth',block:'center'});
    return ok;
  }
  return true;
}

$('#next').onclick = () => {
  if (S.step===5) { resetAll(); return; }
  if (!validate()) return;
  S.step++; window.scrollTo(0,0); render();
};
$('#back').onclick = () => { if (S.step>0) { S.step--; window.scrollTo(0,0); render(); } };

S.usesLine = 'LINEで受け取る';
render();
})();
</script>
</body>
</html>
